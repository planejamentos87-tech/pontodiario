<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4c1d95" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Agenda do Professor de Informática</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          try {
            navigator.serviceWorker.register('/sw.js')
              .then(reg => {
                console.log('Fidelização PWA: Service Worker ativo sob escopo:', reg.scope);
              })
              .catch(err => {
                console.warn('Falha de contingência na inicialização do PWA:', err);
              });
          } catch (e) {
            console.warn('Service worker registration error skipped:', e);
          }
        });
      }
    </script>
  </body>
</html>
